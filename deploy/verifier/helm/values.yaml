# World brokered handoff sessions are process-local. The chart deliberately
# rejects replica counts above one until sessions are resumable or owner-routed.
replicaCount: 1

image:
  repository: ghcr.io/x424protocol/x424-verifier
  # Published 0.1.4 image, pinned immutably.
  tag: "0.1.4"
  digest: "sha256:471dd506115fb740e61e0f1263161ba91f171c706e7b4071c9e606feb1cb8061"
  pullPolicy: IfNotPresent

service:
  port: 8080

config:
  # This single-instance chart is an evaluation surface, not evidence that the
  # multi-instance prod-ha-0.2 profile has been satisfied.
  deploymentProfile: eval-redis-0.2
  providerRequestMode: issuer
  worldEnvironment: staging
  worldAllowLegacyProofs: "false"
  # Redis Cluster is not supported by the 0.1.3 multi-key migration scripts.
  redisTopology: single-endpoint
  # Set this to the exact number of operator-controlled reverse-proxy hops.
  # Leave zero when the verifier is reached directly.
  trustProxyHops: 0

secretName: x424-verifier

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  enabled: true
  # Empty ingress selectors permit any source to reach the service port for
  # functional evaluation. Production and nonzero trustProxyHops require at
  # least one reviewed source. Labels form one combined NetworkPolicy peer.
  ingressCidrs: []
  ingressNamespaceLabels: {}
  ingressPodLabels: {}
  # Empty CIDR lists permit the corresponding port to any destination so the
  # evaluation default is functional. The chart rejects empty lists when
  # config.deploymentProfile is prod-ha-0.2.
  dnsCidrs: []
  worldPort: 443
  worldCidrs: []
  redisPort: 6379
  redisCidrs: []

podDisruptionBudget:
  enabled: true
