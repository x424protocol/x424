{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must remain 1 while World brokered handoff sessions are process-local" }}
{{- end }}
{{- $hasRestrictedIngress := or (gt (len .Values.networkPolicy.ingressCidrs) 0) (gt (len .Values.networkPolicy.ingressNamespaceLabels) 0) (gt (len .Values.networkPolicy.ingressPodLabels) 0) }}
{{- if eq .Values.config.deploymentProfile "prod-ha-0.2" }}
{{- if not .Values.image.digest }}
{{- fail "prod-ha-0.2 requires image.digest; mutable image tags are forbidden" }}
{{- end }}
{{- if not .Values.networkPolicy.enabled }}
{{- fail "prod-ha-0.2 requires the chart NetworkPolicy to be enabled" }}
{{- end }}
{{- if or (eq (len .Values.networkPolicy.dnsCidrs) 0) (eq (len .Values.networkPolicy.worldCidrs) 0) (eq (len .Values.networkPolicy.redisCidrs) 0) }}
{{- fail "prod-ha-0.2 requires non-empty networkPolicy.dnsCidrs, worldCidrs, and redisCidrs" }}
{{- end }}
{{- if not $hasRestrictedIngress }}
{{- fail "prod-ha-0.2 requires a restricted ingress source via networkPolicy.ingressCidrs, ingressNamespaceLabels, or ingressPodLabels" }}
{{- end }}
{{- end }}
{{- if and (gt (int .Values.config.trustProxyHops) 0) (or (not .Values.networkPolicy.enabled) (not $hasRestrictedIngress)) }}
{{- fail "nonzero config.trustProxyHops requires an enabled NetworkPolicy and an explicit ingress source" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: x424-verifier
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RollingUpdate would briefly create a second pod, but a World handoff cannot
  # follow its process-local session handle to that pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: x424-verifier
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: x424-verifier
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: X424_DEPLOYMENT_PROFILE
              value: {{ .Values.config.deploymentProfile | quote }}
            - name: X424_PROVIDER_REQUEST_MODE
              value: {{ .Values.config.providerRequestMode | quote }}
            - name: WORLD_ENVIRONMENT
              value: {{ .Values.config.worldEnvironment | quote }}
            - name: WORLD_ALLOW_LEGACY_PROOFS
              value: {{ .Values.config.worldAllowLegacyProofs | quote }}
            - name: X424_REDIS_TOPOLOGY
              value: {{ .Values.config.redisTopology | quote }}
            - name: X424_TRUST_PROXY_HOPS
              value: {{ .Values.config.trustProxyHops | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
