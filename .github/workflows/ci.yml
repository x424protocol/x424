name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Run one-command quickstart
        run: pnpm quickstart

      - name: Inspect publishable package
        run: npm pack --dry-run

      - name: Validate verifier Helm chart
        run: bash scripts/verify-helm-chart.sh

      - name: Build and smoke-test self-hosted verifier image
        run: pnpm image:smoke

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Check website
        working-directory: site
        run: npm test

      - name: Audit website dependencies
        working-directory: site
        # Legacy lint-only minimatch consumers have no API-compatible patched line.
        # The deployed site excludes devDependencies; audit the graph that ships.
        run: npm audit --omit=dev --audit-level=moderate
