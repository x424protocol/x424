name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit package dependencies
        run: pnpm audit --audit-level=moderate

      - name: Check
        run: pnpm check

      - name: Run one-command quickstart
        run: pnpm quickstart

      - name: Inspect publishable package
        run: npm pack --dry-run

      - name: Validate verifier Helm chart
        run: bash scripts/verify-helm-chart.sh

      - name: Build and smoke-test self-hosted verifier image
        run: pnpm image:smoke

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Check website
        working-directory: site
        run: npm test

      - name: Audit website dependencies
        working-directory: site
        run: npm audit --audit-level=moderate
